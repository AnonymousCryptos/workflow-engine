services:

  mysql:
    image: mysql:8.0
    container_name: workflow_engine_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: workflow_engine_phpmyadmin
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql

    ports:
      - "8080:80"

  backend:
    build: .
    container_name: workflow_engine_backend
    restart: unless-stopped

    depends_on:
      - mysql

    env_file:
      - .env

    ports:
      - "3000:3000"

volumes:
  mysql_data:

